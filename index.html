<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto por QR">
  <title>Contáctanos</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="icon">✉️</div>
      <h1>Contáctanos</h1>
      <p class="intro">Completa el formulario y recibiré tu mensaje directamente por correo.</p>

      <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" id="accessKey">

        <input type="hidden" name="subject" value="Nuevo mensaje recibido desde QR">
        <input type="hidden" name="from_name" value="Formulario QR">
        <input type="hidden" name="redirect" value="">

        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" maxlength="100" required>

        <label for="email">Tu correo</label>
        <input id="email" name="email" type="email" placeholder="tu@correo.com" maxlength="150" required>

        <label for="phone">Teléfono <span>(opcional)</span></label>
        <input id="phone" name="phone" type="tel" placeholder="+56 9..." maxlength="30">

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="7" placeholder="Escribe tu mensaje..." maxlength="2000" required></textarea>

        <!-- Anti-spam honeypot -->
        <input type="checkbox" name="botcheck" class="hidden">

        <button id="submitBtn" type="submit">Enviar mensaje</button>
        <p id="status" class="status"></p>
      </form>
    </section>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
