<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Escanear QR</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .contenedor {

            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.12);

            text-align: center;
        }

        h1 {

            margin-top: 0;

            color: #222;

        }

        .descripcion {

            color: #666;

            margin-bottom: 20px;

            line-height: 1.5;
        }

        #reader {

            width: 100%;

            max-width: 420px;

            margin: 0 auto;

            overflow: hidden;

            border-radius: 15px;

        }

        #estado {

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #f1f3f5;

            color: #333;

            line-height: 1.5;

        }

        #resultado {

            display: none;

            margin-top: 20px;

            padding: 20px;

            border-radius: 12px;

            background: #e8f5e9;

            color: #1b5e20;
        }

        #error {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #ffebee;

            color: #b71c1c;

            text-align: left;

            word-break: break-word;
        }

        .ubicacion {

            font-size: 22px;

            font-weight: bold;

            margin: 10px 0;

        }

        button {

            border: none;

            border-radius: 10px;

            padding: 14px 20px;

            font-size: 16px;

            cursor: pointer;

            margin-top: 15px;
        }

        .volver {

            display: inline-block;

            text-decoration: none;

            color: white;

            background: #333;

            padding: 12px 20px;

            border-radius: 10px;

            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="contenedor">


    <h1>
        📱 Escanear QR
    </h1>


    <div class="descripcion">

        Apunta la cámara trasera hacia el código QR
        correspondiente al piso y sector.

    </div>


    <div id="reader"></div>


    <div id="estado">

        Iniciando cámara...

    </div>


    <div id="resultado">

        <div>
            Ubicación detectada:
        </div>

        <div
            id="ubicacion"
            class="ubicacion"
        ></div>

        <div>
            Redirigiendo al formulario...
        </div>

    </div>


    <div id="error"></div>


    <a
        href="./index.html"
        class="volver"
    >
        ← Volver
    </a>


</div>


<script>


// ============================================================
// ELEMENTOS
// ============================================================

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");

const errorBox =
    document.getElementById("error");

const ubicacion =
    document.getElementById("ubicacion");


// ============================================================
// MOSTRAR ERROR
// ============================================================

function mostrarError(mensaje) {

    estado.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML =
        "<strong>❌ No se pudo abrir la cámara.</strong><br><br>" +
        mensaje;

}


// ============================================================
// PROCESAR QR
// ============================================================

function procesarQR(texto) {

    try {

        console.log(
            "QR detectado:",
            texto
        );


        let url;


        // ====================================================
        // INTENTAR INTERPRETAR COMO URL
        // ====================================================

        try {

            url =
                new URL(
                    texto
                );

        } catch (e) {

            url = null;

        }


        // ====================================================
        // EXTRAER PISO Y SECTOR
        // ====================================================

        let piso = null;

        let sector = null;


        if (url) {

            piso =
                url.searchParams.get(
                    "piso"
                );

            sector =
                url.searchParams.get(
                    "sector"
                );

        }


        // ====================================================
        // TAMBIÉN PERMITIR TEXTO:
        //
        // piso=3&sector=B
        // ====================================================

        if (!piso || !sector) {

            const textoNormalizado =
                texto.trim();


            const parametros =
                new URLSearchParams(
                    textoNormalizado
                );


            piso =
                parametros.get(
                    "piso"
                );

            sector =
                parametros.get(
                    "sector"
                );

        }


        // ====================================================
        // VALIDAR
        // ====================================================

        if (!piso || !sector) {

            mostrarError(
                "El código QR no contiene un piso y un sector válidos.<br><br>" +
                "QR leído:<br>" +
                "<strong>" +
                texto +
                "</strong>"
            );

            return;

        }


        // ====================================================
        // NORMALIZAR
        // ====================================================

        piso =
            String(piso).trim();

        sector =
            String(sector)
                .trim()
                .toUpperCase();


        // ====================================================
        // MOSTRAR RESULTADO
        // ====================================================

        document.getElementById(
            "reader"
        ).style.display = "none";


        estado.style.display =
            "none";


        resultado.style.display =
            "block";


        ubicacion.textContent =
            "Piso " +
            piso +
            " - Sector " +
            sector;


        // ====================================================
        // REDIRIGIR
        // ====================================================

        setTimeout(
            function() {

                window.location.href =
                    "./index.html?piso=" +
                    encodeURIComponent(
                        piso
                    ) +
                    "&sector=" +
                    encodeURIComponent(
                        sector
                    );

            },
            1000
        );


    } catch (error) {

        mostrarError(
            "Error procesando el código QR:<br><br>" +
            error.message
        );

    }

}


// ============================================================
// CONFIGURACIÓN DEL ESCÁNER
// ============================================================

const html5QrCode =
    new Html5Qrcode(
        "reader"
    );


// ============================================================
// OPCIONES
// ============================================================

const config = {

    fps: 10,

    qrbox: {
        width: 250,
        height: 250
    },

    aspectRatio: 1.0

};


// ============================================================
// INICIAR CÁMARA
// ============================================================

async function iniciarCamara() {

    estado.textContent =
        "Solicitando acceso a la cámara...";


    try {

        // ====================================================
        // COMPROBAR SOPORTE
        // ====================================================

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Este navegador no permite acceder a la cámara desde esta página."
            );

        }


        // ====================================================
        // PEDIR PERMISO EXPLÍCITAMENTE
        // ====================================================

        estado.textContent =
            "Solicitando permiso para utilizar la cámara...";


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });


        // ====================================================
        // PERMISO CONCEDIDO
        // ====================================================

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        estado.textContent =
            "Cámara autorizada. Iniciando lector QR...";


        // ====================================================
        // INICIAR HTML5 QR CODE
        // ====================================================

        await html5QrCode.start(

            {
                facingMode: {
                    ideal: "environment"
                }
            },

            config,

            function(decodedText) {

                procesarQR(
                    decodedText
                );

            },

            function(errorMessage) {

                // No mostramos errores normales
                // de búsqueda de QR.

                console.log(
                    "Buscando QR:",
                    errorMessage
                );

            }

        );


        estado.textContent =
            "📷 Cámara activa. Apunta al código QR.";


    } catch (error) {

        console.error(
            "ERROR DE CÁMARA:",
            error
        );


        let mensaje =
            "Error desconocido.";


        if (
            error.name ===
            "NotAllowedError"
        ) {

            mensaje =
                "El navegador rechazó el acceso a la cámara. " +
                "Aunque el permiso aparezca activado, intenta " +
                "recargar la página y volver a permitir la cámara.";

        }


        else if (
            error.name ===
            "NotFoundError"
        ) {

            mensaje =
                "No se encontró ninguna cámara disponible en el dispositivo.";

        }


        else if (
            error.name ===
            "NotReadableError"
        ) {

            mensaje =
                "La cámara existe, pero otro programa o aplicación " +
                "podría estar utilizándola. Cierra otras aplicaciones " +
                "que estén usando la cámara y vuelve a intentarlo.";

        }


        else if (
            error.name ===
            "OverconstrainedError"
        ) {

            mensaje =
                "El navegador no pudo seleccionar una cámara compatible. " +
                "Se intentó utilizar la cámara trasera.";

        }


        else if (
            error.name ===
            "SecurityError"
        ) {

            mensaje =
                "El navegador bloqueó el acceso a la cámara por razones de seguridad.";

        }


        else {

            mensaje =
                error.name +
                ": " +
                error.message;

        }


        mostrarError(
            mensaje
        );

    }

}


// ============================================================
// INICIAR
// ============================================================

iniciarCamara();


</script>


</body>

</html>
